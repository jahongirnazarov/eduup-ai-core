<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malika Natural 3D Classroom - EduUp</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
        }
        #ui-overlay {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 350px;
        }
        #ui-overlay h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
        }
        .control-group {
            margin-bottom: 15px;
        }
        .control-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 600;
            font-size: 12px;
        }
        .control-group input,
        .control-group select {
            width: 100%;
            padding: 8px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        #smartboard-content {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            max-width: 600px;
            z-index: 50;
            display: none;
            text-align: center;
        }
        #smartboard-content h3 {
            color: #333;
            margin-bottom: 15px;
        }
        #smartboard-content p {
            color: #666;
            line-height: 1.6;
            font-size: 16px;
        }
        #malika-speech {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 400px;
            z-index: 100;
            display: none;
        }
        #malika-speech p {
            color: #333;
            line-height: 1.5;
        }
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            flex-direction: column;
        }
        #loading h1 {
            color: white;
            font-size: 32px;
            margin-bottom: 20px;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <h1>Malika Natural 3D Classroom</h1>
        <p style="color: white;">Yuklanmoqda...</p>
    </div>

    <div id="canvas-container"></div>

    <div id="ui-overlay">
        <h2>🎓 Malika Natural Classroom</h2>
        
        <div class="control-group">
            <label>Dars mavzusi:</label>
            <input type="text" id="lesson-topic" placeholder="Masalan: Kvadrat tenglamalar">
        </div>
        
        <div class="control-group">
            <label>Fan:</label>
            <select id="subject">
                <option value="math">Matematika</option>
                <option value="physics">Fizika</option>
                <option value="english">Ingliz tili</option>
                <option value="chemistry">Kimyo</option>
            </select>
        </div>
        
        <button onclick="startLesson()">Darsni boshlash</button>
        
        <div class="control-group" style="margin-top: 15px;">
            <label>Smartboard content:</label>
            <input type="text" id="board-content" placeholder="Doskaga yozish...">
        </div>
        
        <button onclick="writeOnSmartboard()">Doskaga yozish</button>
        
        <div class="control-group" style="margin-top: 15px;">
            <button onclick="toggleSmartboardLight()">Doskani yoritish</button>
            <button onclick="resetCamera()">Kamerani qaytarish</button>
        </div>
        
        <div class="control-group" style="margin-top: 15px;">
            <label>Ovozli boshqaruv:</label>
            <button onclick="toggleVoiceRecognition()">🎤 Ovozni yoqish/o'chirish</button>
        </div>
        
        <div id="voice-status" style="margin-top: 10px; font-size: 12px; color: #666;">
            Ovoz: O'chirilgan
        </div>
    </div>

    <div id="smartboard-content">
        <h3 id="board-title">Malika Smartboard</h3>
        <p id="board-text"></p>
    </div>

    <div id="malika-speech">
        <p id="speech-text"></p>
    </div>

    <script>
        // Three.js Scene Setup
        let scene, camera, renderer, controls;
        let classroom, smartboard, teacher, lights = [];
        let smartboardLight, ambientLight, directionalLight;
        let isLessonStarted = false;

        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); // Sky blue

            // Camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 8);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.outputEncoding = THREE.sRGBEncoding;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 3;
            controls.maxDistance = 15;
            controls.maxPolarAngle = Math.PI / 2;

            // Create natural classroom
            createNaturalClassroom();

            // Create smartboard
            createSmartboard();

            // Create teacher avatar
            createTeacherAvatar();

            // Lighting
            setupNaturalLighting();

            // Window resize handler
            window.addEventListener('resize', onWindowResize);

            // Hide loading
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
            }, 1500);

            // Animation loop
            animate();
        }

        function createNaturalClassroom() {
            classroom = new THREE.Group();

            // Floor - wooden texture
            const floorGeometry = new THREE.PlaneGeometry(20, 15);
            const floorMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xDEB887,
                roughness: 0.8,
                metalness: 0.1
            });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            classroom.add(floor);

            // Walls - cream color
            const wallMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xFFF8DC,
                roughness: 0.9,
                metalness: 0.0
            });

            // Back wall
            const backWall = new THREE.Mesh(new THREE.PlaneGeometry(20, 5), wallMaterial);
            backWall.position.set(0, 2.5, -7.5);
            backWall.receiveShadow = true;
            classroom.add(backWall);

            // Left wall
            const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(15, 5), wallMaterial);
            leftWall.position.set(-10, 2.5, 0);
            leftWall.rotation.y = Math.PI / 2;
            leftWall.receiveShadow = true;
            classroom.add(leftWall);

            // Right wall
            const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(15, 5), wallMaterial);
            rightWall.position.set(10, 2.5, 0);
            rightWall.rotation.y = -Math.PI / 2;
            rightWall.receiveShadow = true;
            classroom.add(rightWall);

            // Ceiling
            const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(20, 15), wallMaterial);
            ceiling.position.set(0, 5, 0);
            ceiling.rotation.x = Math.PI / 2;
            classroom.add(ceiling);

            // Windows on left wall
            createWindow(-10, 3, -2);
            createWindow(-10, 3, 2);

            // Teacher's desk
            const deskGeometry = new THREE.BoxGeometry(3, 1, 1.5);
            const deskMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x8B4513,
                roughness: 0.7,
                metalness: 0.1
            });
            const desk = new THREE.Mesh(deskGeometry, deskMaterial);
            desk.position.set(0, 0.5, -6);
            desk.castShadow = true;
            desk.receiveShadow = true;
            classroom.add(desk);

            // Student desks
            for (let i = 0; i < 3; i++) {
                const studentDesk = new THREE.Mesh(
                    new THREE.BoxGeometry(2, 0.8, 1),
                    deskMaterial
                );
                studentDesk.position.set(-3 + i * 3, 0.4, 2);
                studentDesk.castShadow = true;
                studentDesk.receiveShadow = true;
                classroom.add(studentDesk);

                // Chairs
                const chairGeometry = new THREE.BoxGeometry(0.5, 0.5, 0.5);
                const chairMaterial = new THREE.MeshStandardMaterial({ 
                    color: 0x4169E1,
                    roughness: 0.6
                });
                const chair = new THREE.Mesh(chairGeometry, chairMaterial);
                chair.position.set(-3 + i * 3, 0.9, 2.8);
                chair.castShadow = true;
                classroom.add(chair);
            }

            scene.add(classroom);
        }

        function createWindow(x, y, z) {
            const windowFrame = new THREE.Mesh(
                new THREE.BoxGeometry(0.2, 2, 3),
                new THREE.MeshStandardMaterial({ color: 0x8B4513 })
            );
            windowFrame.position.set(x, y, z);
            classroom.add(windowFrame);

            const windowGlass = new THREE.Mesh(
                new THREE.PlaneGeometry(2.8, 1.8),
                new THREE.MeshStandardMaterial({ 
                    color: 0x87CEEB,
                    transparent: true,
                    opacity: 0.6,
                    roughness: 0.1
                })
            );
            windowGlass.position.set(x + 0.11, y, z);
            windowGlass.rotation.y = Math.PI / 2;
            classroom.add(windowGlass);
        }

        function createSmartboard() {
            smartboard = new THREE.Group();

            // Board frame
            const frameGeometry = new THREE.BoxGeometry(6.2, 4.2, 0.15);
            const frameMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x2F4F4F,
                roughness: 0.5,
                metalness: 0.3
            });
            const frame = new THREE.Mesh(frameGeometry, frameMaterial);
            frame.position.set(0, 2.5, -7.4);
            frame.castShadow = true;
            smartboard.add(frame);

            // Board screen
            const screenGeometry = new THREE.PlaneGeometry(6, 4);
            const screenMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xFFFFFF,
                roughness: 0.2,
                metalness: 0.1,
                emissive: 0xFFFFFF,
                emissiveIntensity: 0.1
            });
            const screen = new THREE.Mesh(screenGeometry, screenMaterial);
            screen.position.set(0, 2.5, -7.32);
            screen.receiveShadow = true;
            screen.name = 'smartboard-screen';
            smartboard.add(screen);

            // Smartboard light (spotlight)
            smartboardLight = new THREE.SpotLight(0xFFFFFF, 0.5);
            smartboardLight.position.set(0, 5, -5);
            smartboardLight.target = screen;
            smartboardLight.angle = Math.PI / 6;
            smartboardLight.penumbra = 0.3;
            smartboardLight.castShadow = true;
            smartboard.add(smartboardLight);

            scene.add(smartboard);
        }

        function createTeacherAvatar() {
            teacher = new THREE.Group();

            // Body
            const bodyGeometry = new THREE.CylinderGeometry(0.3, 0.4, 1.2, 16);
            const bodyMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x1E90FF,
                roughness: 0.6
            });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.position.y = 0.9;
            body.castShadow = true;
            teacher.add(body);

            // Head
            const headGeometry = new THREE.SphereGeometry(0.25, 32, 32);
            const headMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xFFDBB4,
                roughness: 0.8
            });
            const head = new THREE.Mesh(headGeometry, headMaterial);
            head.position.y = 1.75;
            head.castShadow = true;
            teacher.add(head);

            // Hair
            const hairGeometry = new THREE.SphereGeometry(0.27, 32, 32, 0, Math.PI * 2, 0, Math.PI / 2);
            const hairMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x4A3728,
                roughness: 0.9
            });
            const hair = new THREE.Mesh(hairGeometry, hairMaterial);
            hair.position.y = 1.8;
            teacher.add(hair);

            // Arms
            const armGeometry = new THREE.CylinderGeometry(0.08, 0.08, 0.8, 16);
            const armMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x1E90FF,
                roughness: 0.6
            });

            const leftArm = new THREE.Mesh(armGeometry, armMaterial);
            leftArm.position.set(-0.45, 1.0, 0);
            leftArm.rotation.z = 0.3;
            leftArm.castShadow = true;
            teacher.add(leftArm);

            const rightArm = new THREE.Mesh(armGeometry, armMaterial);
            rightArm.position.set(0.45, 1.0, 0);
            rightArm.rotation.z = -0.3;
            rightArm.castShadow = true;
            teacher.add(rightArm);

            // Legs
            const legGeometry = new THREE.CylinderGeometry(0.1, 0.12, 0.8, 16);
            const legMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x2F4F4F,
                roughness: 0.7
            });

            const leftLeg = new THREE.Mesh(legGeometry, legMaterial);
            leftLeg.position.set(-0.15, 0.2, 0);
            leftLeg.castShadow = true;
            teacher.add(leftLeg);

            const rightLeg = new THREE.Mesh(legGeometry, legMaterial);
            rightLeg.position.set(0.15, 0.2, 0);
            rightLeg.castShadow = true;
            teacher.add(rightLeg);

            teacher.position.set(0, 0, -5);
            teacher.castShadow = true;
            scene.add(teacher);
        }

        function setupNaturalLighting() {
            // Ambient light (soft overall illumination)
            ambientLight = new THREE.AmbientLight(0xFFFFFF, 0.4);
            scene.add(ambientLight);

            // Main directional light (sunlight from windows)
            directionalLight = new THREE.DirectionalLight(0xFFFFE0, 0.8);
            directionalLight.position.set(-5, 5, 5);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            directionalLight.shadow.camera.near = 0.5;
            directionalLight.shadow.camera.far = 50;
            directionalLight.shadow.camera.left = -10;
            directionalLight.shadow.camera.right = 10;
            directionalLight.shadow.camera.top = 10;
            directionalLight.shadow.camera.bottom = -10;
            scene.add(directionalLight);

            // Fill light
            const fillLight = new THREE.DirectionalLight(0x87CEEB, 0.3);
            fillLight.position.set(5, 3, -5);
            scene.add(fillLight);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Subtle teacher animation
            if (teacher && isLessonStarted) {
                teacher.rotation.y = Math.sin(Date.now() * 0.001) * 0.1;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        // UI Functions
        function startLesson() {
            const topic = document.getElementById('lesson-topic').value;
            const subject = document.getElementById('subject').value;
            
            if (!topic) {
                alert('Iltimos, dars mavzusini kiriting');
                return;
            }

            isLessonStarted = true;
            
            // Show speech
            showMalikaSpeech(`Assalomu alaykum! Bugun biz "${topic}" mavzusini o'rganamiz. ${subject} fanining qiziqarli mavzusi.`);
            
            // Write on smartboard
            writeOnSmartboardContent(topic, `Dars: ${topic}\nFan: ${subject}`);
            
            // Move teacher to smartboard
            teacher.position.set(0, 0, -6);
        }

        function writeOnSmartboard() {
            const content = document.getElementById('board-content').value;
            if (!content) {
                alert('Iltimos, content kiriting');
                return;
            }
            writeOnSmartboardContent(content, content);
        }

        function writeOnSmartboardContent(title, text) {
            document.getElementById('board-title').textContent = title;
            document.getElementById('board-text').textContent = text;
            document.getElementById('smartboard-content').style.display = 'block';
            
            // Highlight smartboard
            const screen = smartboard.getObjectByName('smartboard-screen');
            if (screen) {
                screen.material.emissiveIntensity = 0.3;
                setTimeout(() => {
                    screen.material.emissiveIntensity = 0.1;
                }, 2000);
            }
        }

        function showMalikaSpeech(text) {
            document.getElementById('speech-text').textContent = text;
            document.getElementById('malika-speech').style.display = 'block';
            
            setTimeout(() => {
                document.getElementById('malika-speech').style.display = 'none';
            }, 5000);
        }

        function toggleSmartboardLight() {
            if (smartboardLight) {
                smartboardLight.intensity = smartboardLight.intensity > 0 ? 0 : 0.5;
            }
        }

        function resetCamera() {
            camera.position.set(0, 2, 8);
            controls.target.set(0, 2, 0);
            controls.update();
        }

        // Initialize
        init();
    </script>
</body>
</html>
