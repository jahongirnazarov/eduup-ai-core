<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduUp - Realistic Virtual Classroom</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 25px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .status-badge {
            background: rgba(102, 126, 234, 0.2);
            border: 1px solid #667eea;
            padding: 8px 20px;
            border-radius: 25px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: #4ade80;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        .controls {
            pointer-events: auto;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: #ffffff;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: none;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
        }

        .exam-panel {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            max-width: 500px;
            max-height: 400px;
            overflow-y: auto;
            backdrop-filter: blur(10px);
            display: none;
        }

        .exam-panel.active {
            display: block;
        }

        .exam-question {
            font-size: 1.1rem;
            margin-bottom: 20px;
            line-height: 1.6;
            color: #ffffff;
        }

        .exam-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .exam-option {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #ffffff;
        }

        .exam-option:hover {
            background: rgba(102, 126, 234, 0.2);
            border-color: #667eea;
        }

        .exam-option.selected {
            background: rgba(102, 126, 234, 0.4);
            border-color: #667eea;
        }

        .exam-option.correct {
            background: rgba(74, 222, 128, 0.3);
            border-color: #4ade80;
        }

        .exam-option.incorrect {
            background: rgba(239, 68, 68, 0.3);
            border-color: #ef4444;
        }

        .timer-display {
            font-size: 2rem;
            font-weight: 700;
            color: #ffffff;
            text-align: center;
            margin-bottom: 20px;
        }

        .chat-container {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            max-width: 400px;
            max-height: 300px;
            overflow-y: auto;
            backdrop-filter: blur(10px);
        }

        .chat-messages {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        .message {
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 85%;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .message.user {
            background: rgba(102, 126, 234, 0.3);
            align-self: flex-end;
            border: 1px solid rgba(102, 126, 234, 0.5);
        }

        .message.teacher {
            background: rgba(255, 255, 255, 0.1);
            align-self: flex-start;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .input-container {
            display: flex;
            gap: 10px;
        }

        .input-container input {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 12px 16px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .input-container input:focus {
            border-color: #667eea;
        }

        .input-container button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .input-container button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loader {
            width: 80px;
            height: 80px;
            border: 4px solid rgba(102, 126, 234, 0.3);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 25px;
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.8);
        }

        .performance-stats {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.7);
            pointer-events: auto;
            backdrop-filter: blur(10px);
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 15px;
                padding: 15px;
            }

            .controls {
                flex-direction: column;
                width: 100%;
            }

            .btn {
                width: 100%;
            }

            .chat-container {
                max-width: 100%;
                max-height: 200px;
            }

            .exam-panel {
                max-width: 100%;
                max-height: 300px;
            }

            .performance-stats {
                display: none;
            }
        }
    </style>
</head>

            renderer = new THREE.WebGLRenderer({
                antialias: true,
                alpha: true,
                powerPreference: CONFIG.powerPreference
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(CONFIG.pixelRatio);
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Simple Mouse Controls
            document.addEventListener('mousemove', (event) => {
                mouseX = (event.clientX / window.innerWidth) * 2 - 1;
                mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
            });

            // Lighting Setup
            setupLighting();

            // Create Classroom Environment
            createClassroomEnvironment();

            // Create Teacher Avatar
            createTeacherAvatar();

            // Clock for Animation
            clock = new THREE.Clock();

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
        }

        function setupLighting() {

            mainLight.position.set(0, 8, 0);
            mainLight.castShadow = true;
            mainLight.shadow.mapSize.width = 2048;
            mainLight.shadow.mapSize.height = 2048;
            mainLight.shadow.camera.near = 0.5;
            mainLight.shadow.camera.far = 20;

            mainLight.shadow.camera.top = 10;

            // Eyebrows (natural, feminine)
            const eyebrowGeometry = new THREE.CapsuleGeometry(0.02, 0.04, 4, 8);
            const eyebrowMaterial = new THREE.MeshStandardMaterial({
                color: 0x3d2314,
                roughness: 0.8,
                metalness: 0.0
            });

            const leftEyebrow = new THREE.Mesh(eyebrowGeometry, eyebrowMaterial);
            leftEyebrow.position.set(-0.05, 1.635, 0.115);
            leftEyebrow.rotation.z = 0.2;
            leftEyebrow.scale.set(1, 1, 0.5);
            teacherGroup.add(leftEyebrow);

            const rightEyebrow = new THREE.Mesh(eyebrowGeometry, eyebrowMaterial);
            rightEyebrow.position.set(0.05, 1.635, 0.115);
            rightEyebrow.rotation.z = -0.2;
            rightEyebrow.scale.set(1, 1, 0.5);
            teacherGroup.add(rightEyebrow);

            // Nose (subtle, natural)
            const noseGeometry = new THREE.ConeGeometry(0.02, 0.06, 16);
            const nose = new THREE.Mesh(noseGeometry, skinMaterial);
            nose.position.set(0, 1.55, 0.13);
            nose.rotation.x = Math.PI / 2;
            nose.scale.set(1, 1, 0.6);
            teacherGroup.add(nose);

            // Mouth (detailed for natural lip-sync)
            const upperLipGeometry = new THREE.SphereGeometry(0.02, 32, 32);
            const lipMaterial = new THREE.MeshStandardMaterial({
                color: 0xc4785a,
                roughness: 0.4,
                metalness: 0.05,
                emissive: 0x1a1a1a,
                emissiveIntensity: 0.01
            });

            const upperLip = new THREE.Mesh(upperLipGeometry, lipMaterial);
            upperLip.position.set(0, 1.52, 0.125);
            upperLip.scale.set(1.5, 0.4, 0.4);
            upperLip.name = 'upperLip';
            teacherGroup.add(upperLip);

            const lowerLipGeometry = new THREE.SphereGeometry(0.022, 32, 32);
            const lowerLip = new THREE.Mesh(lowerLipGeometry, lipMaterial);
            lowerLip.position.set(0, 1.505, 0.125);
            lowerLip.scale.set(1.6, 0.5, 0.45);
            lowerLip.name = 'lowerLip';
            teacherGroup.add(lowerLip);

            // Store original positions for animation
            teacherModel = teacherGroup;
            teacherModel.position.set(0, 0, -5);
            teacherModel.userData.originalPositions = {};
            
            teacherModel.traverse(function(child) {
                if (child.isMesh) {
                    teacherModel.userData.originalPositions[child.uuid] = {
                        position: child.position.clone(),
                        rotation: child.rotation.clone(),
                        scale: child.scale.clone()
                    };
                }
            });

            scene.add(teacherModel);

            // Initialize animation mixer
            mixer = new THREE.AnimationMixer(teacherModel);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ========================================================================
        // REAL-TIME LIP-SYNC SYSTEM
        // ========================================================================

        function initAudioContext() {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                
                console.log('Audio context initialized for lip-sync');
            } catch (error) {
                console.error('Audio context initialization failed:', error);
            }
        }

        function updateLipSync() {
            if (!lipSyncEnabled || !teacherModel) return;

            if (isSpeaking && audioContext) {
                analyser.getByteFrequencyData(dataArray);
                
                // Calculate average frequency with more sophisticated analysis
                let sum = 0;
                let peak = 0;
                for (let i = 0; i < dataArray.length; i++) {
                    sum += dataArray[i];
                    if (dataArray[i] > peak) peak = dataArray[i];
                }
                const average = sum / dataArray.length;
                const intensity = average / 255;
                const peakIntensity = peak / 255;

                // Natural lip-sync with upper and lower lip movement
                teacherModel.traverse(function(child) {
                    if (child.name === 'upperLip') {
                        // Upper lip moves slightly up when speaking
                        const upperMovement = intensity * 0.3;
                        child.position.y = 1.52 + upperMovement;
                        child.scale.y = 0.4 + intensity * 0.2;
                    }
                    if (child.name === 'lowerLip') {
                        // Lower lip moves down more when speaking
                        const lowerMovement = intensity * 0.5;
                        child.position.y = 1.505 - lowerMovement;
                        child.scale.y = 0.5 + intensity * 0.4;
                        child.scale.x = 1.6 + peakIntensity * 0.3;
                    }
                });
            } else {
                // Reset lips to natural position when not speaking
                teacherModel.traverse(function(child) {
                    if (child.name === 'upperLip') {
                        child.position.y = 1.52;
                        child.scale.y = 0.4;
                    }
                    if (child.name === 'lowerLip') {
                        child.position.y = 1.505;
                        child.scale.y = 0.5;
                        child.scale.x = 1.6;
                    }
                });
            }
        }

        function updateBodyMovements() {
            if (!bodyMovementEnabled || !teacherModel) return;

            const time = clock.getElapsedTime();

            // Natural breathing animation (subtle chest movement)
            if (currentAnimation === 'idle') {
                const breathingIntensity = Math.sin(time * 1.2) * 0.008;
                teacherModel.position.y = breathingIntensity;
                
                // Subtle shoulder movement during breathing
                teacherModel.traverse(function(child) {
                    if (child.name === 'leftUpperArm' || child.name === 'rightUpperArm') {
                        child.position.y += breathingIntensity * 0.5;
                    }
                });
            }

            // Natural speaking gestures (hand movements, head tilts)
            if (isSpeaking && currentAnimation === 'idle') {
                // Subtle head movement while speaking
                const headMovement = Math.sin(time * 2.5) * 0.03;
                teacherModel.rotation.y = headMovement;
                
                // Hand gestures while speaking
                teacherModel.traverse(function(child) {
                    if (child.name === 'leftForearm') {
                        child.rotation.z = 0.15 + Math.sin(time * 4) * 0.15;
                    }
                    if (child.name === 'rightForearm') {
                        child.rotation.z = -0.15 + Math.sin(time * 4 + 0.5) * 0.15;
                    }
                });
                
                // Subtle body sway
                teacherModel.rotation.x = Math.sin(time * 1.8) * 0.01;
            }

            // Walking animation (natural human gait)
            if (currentAnimation === 'walking') {
                const walkCycle = Math.sin(time * 5);
                
                // Leg movement
                teacherModel.traverse(function(child) {
                    if (child.position.y < 0.5) { // Legs
                        child.rotation.x = walkCycle * 0.3;
                    }
                });
                
                // Arm swing (natural opposite to leg movement)
                teacherModel.traverse(function(child) {
                    if (child.name === 'leftUpperArm') {
                        child.rotation.z = 0.25 - walkCycle * 0.2;
                    }
                    if (child.name === 'rightUpperArm') {
                        child.rotation.z = -0.25 + walkCycle * 0.2;
                    }
                });
                
                // Body bob while walking
                teacherModel.position.y = Math.abs(Math.sin(time * 5)) * 0.02;
            }

            // Writing gesture (when at blackboard)
            if (currentAnimation === 'writing') {
                const writingMovement = Math.sin(time * 8) * 0.02;
                
                teacherModel.traverse(function(child) {
                    if (child.name === 'rightForearm') {
                        child.rotation.x = writingMovement;
                    }
                    if (child.name === 'rightHand') {
                        child.position.x = 0.32 + writingMovement;
                    }
                });
            }

            // Eye blinking (natural random blinking)
            if (Math.random() < 0.01) { // 1% chance per frame
                teacherModel.traverse(function(child) {
                    if (child.name === 'leftEyeWhite' || child.name === 'rightEyeWhite') {
                        child.scale.y = 0.1; // Close eyes
                        setTimeout(() => {
                            child.scale.y = 0.6; // Open eyes
                        }, 100);
                    }
                });
            }
        }

        function speakText(text) {
            if (!('speechSynthesis' in window)) {
                console.error('Speech synthesis not supported');
                return;
            }

            window.speechSynthesis.cancel();

            // Add natural pauses for more human-like speech
            const naturalText = text
                .replace(/\./g, '. ...')
                .replace(/,/g, ', ..')
                .replace(/\?/g, '? ....')
                .replace(/!/g, '! ...');

            const utterance = new SpeechSynthesisUtterance(naturalText);
            utterance.lang = 'uz-UZ';
            
            // Natural speech parameters for 25-year-old female voice
            utterance.rate = 0.9; // Slightly slower for clarity
            utterance.pitch = 1.15; // Higher pitch for female voice
            utterance.volume = 0.95; // Natural volume

            // Try to find the best available voice
            const voices = window.speechSynthesis.getVoices();
            
            // Priority: Uzbek female voice, then any Uzbek voice, then best quality voice
            let selectedVoice = voices.find(voice => 
                voice.lang.includes('uz') && voice.name.toLowerCase().includes('female')
            );
            
            if (!selectedVoice) {
                selectedVoice = voices.find(voice => voice.lang.includes('uz'));
            }
            
            if (!selectedVoice) {
                // Try to find a high-quality female voice
                selectedVoice = voices.find(voice => 
                    voice.name.toLowerCase().includes('female') || 
                    voice.name.toLowerCase().includes('woman')
                );
            }
            
            if (!selectedVoice && voices.length > 0) {
                // Use the first available voice as fallback
                selectedVoice = voices[0];
            }
            
            if (selectedVoice) {
                utterance.voice = selectedVoice;
            }

            utterance.onstart = () => {
                isSpeaking = true;
                if (audioContext && audioContext.state === 'suspended') {
                    audioContext.resume();
                }
                document.getElementById('statusLabel').innerText = "O'qituvchi gapirmoqda...";
            };

            utterance.onend = () => {
                isSpeaking = false;
                document.getElementById('statusLabel').innerText = "O'qituvchi kutmoqda...";
            };

            window.speechSynthesis.speak(utterance);
        }

        // ========================================================================
        // EXAM SYSTEM (SAT/IELTS)
        // ========================================================================

        function startSATExam() {
            currentExam = SAT_EXAM_DATA;
            currentSectionIndex = 0;
            currentQuestionIndex = 0;
            examMode = true;
            timeRemaining = SAT_EXAM_DATA.duration * 60;
            userAnswers = [];
            
            document.getElementById('exam-panel').classList.add('active');
            document.getElementById('globalStatus').innerText = SAT_EXAM_DATA.title;
            
            loadQuestion();
            startExamTimer();
            
            // Move teacher to writing position
            currentAnimation = 'writing';
            teacherModel.position.set(0, 0, -8);
            teacherModel.rotation.y = Math.PI; // Face the blackboard
            
            speakText("SAT Digital imtihonini boshlaymiz. Official formatga mos ravishda 4 moduldan iborat. Har bir modul uchun vaqt cheklangan. Omad!");
        }

        function startIELTSExam() {
            currentExam = IELTS_EXAM_DATA;
            currentSectionIndex = 0;
            currentQuestionIndex = 0;
            examMode = true;
            timeRemaining = IELTS_EXAM_DATA.duration * 60;
            userAnswers = [];
            
            document.getElementById('exam-panel').classList.add('active');
            document.getElementById('globalStatus').innerText = IELTS_EXAM_DATA.title;
            
            loadQuestion();
            startExamTimer();
            
            // Move teacher to writing position
            currentAnimation = 'writing';
            teacherModel.position.set(0, 0, -8);
            teacherModel.rotation.y = Math.PI;
            
            speakText("IELTS Academic imtihonini boshlaymiz. Listening, Reading va Writing bo'limlarini o'z ichiga oladi. Official formatga mos ravishda tayyorlangan.");
        }

        function loadQuestion() {
            if (!currentExam) return;

            const section = currentExam.sections[currentSectionIndex];
            
            // Check if this is a writing task
            if (section.isWriting) {
                document.getElementById('exam-question').textContent = section.prompt;
                document.getElementById('exam-question').innerHTML += `<br><br><small>Word limit: ${section.wordLimit}+ words</small><br><small>Criteria: ${section.criteria.join(', ')}</small>`;
                
                const optionsContainer = document.getElementById('exam-options');
                optionsContainer.innerHTML = `
                    <textarea id="writing-answer" style="width: 100%; height: 200px; padding: 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); color: white; font-size: 1rem; resize: none;" placeholder="Write your essay here..."></textarea>
                    <div style="margin-top: 10px; color: #888; font-size: 0.9rem;">Word count: <span id="word-count">0</span></div>
                `;
                
                // Add word count listener
                setTimeout(() => {
                    const textarea = document.getElementById('writing-answer');
                    if (textarea) {
                        textarea.addEventListener('input', function() {
                            const words = this.value.trim().split(/\s+/).filter(word => word.length > 0);
                            document.getElementById('word-count').textContent = words.length;
                        });
                    }
                }, 100);
                
                return;
            }
            
            const question = section.questions[currentQuestionIndex];
            
            document.getElementById('exam-question').textContent = question.question;
            if (question.explanation) {
                document.getElementById('exam-question').innerHTML += `<br><br><small style="color: #888;">Question ${currentQuestionIndex + 1} of ${section.questions.length}</small>`;
            }
            
            const optionsContainer = document.getElementById('exam-options');
            optionsContainer.innerHTML = '';
            
            question.options.forEach((option, index) => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'exam-option';
                optionDiv.textContent = option;
                optionDiv.dataset.index = index;
                optionDiv.onclick = () => selectOption(index);
                optionsContainer.appendChild(optionDiv);
            });
        }

        function selectOption(index) {
            const options = document.querySelectorAll('.exam-option');
            options.forEach(opt => opt.classList.remove('selected'));
            options[index].classList.add('selected');
        }

        function submitAnswer() {
            const section = currentExam.sections[currentSectionIndex];
            
            // Handle writing task submission
            if (section.isWriting) {
                const textarea = document.getElementById('writing-answer');
                if (textarea) {
                    const wordCount = parseInt(document.getElementById('word-count').textContent);
                    if (wordCount < section.wordLimit) {
                        alert(`Iltimos, kamida ${section.wordLimit} so'z yozing. Hozirgi so'z soni: ${wordCount}`);
                        return;
                    }
                    
                    userAnswers.push({
                        section: section.name,
                        type: 'writing',
                        answer: textarea.value,
                        wordCount: wordCount
                    });
                    
                    speakText("Yozuvingiz qabul qilindi. IELTS Writing Task 2 tugadi.");
                    setTimeout(() => endExam(), 2000);
                }
                return;
            }
            
            const selectedOption = document.querySelector('.exam-option.selected');
            if (!selectedOption) {
                alert("Iltimos, javobni tanlang.");
                return;
            }

            const selectedIndex = parseInt(selectedOption.dataset.index);
            const question = section.questions[currentQuestionIndex];
            
            // Store user answer
            userAnswers.push({
                section: section.name,
                questionIndex: currentQuestionIndex,
                selectedAnswer: selectedIndex,
                correctAnswer: question.correct,
                isCorrect: selectedIndex === question.correct
            });
            
            const options = document.querySelectorAll('.exam-option');
            options.forEach(opt => opt.classList.remove('selected'));
            
            if (selectedIndex === question.correct) {
                options[selectedIndex].classList.add('correct');
                speakText("To'g'ri! Ajoyib.");
            } else {
                options[selectedIndex].classList.add('incorrect');
                options[question.correct].classList.add('correct');
                if (question.explanation) {
                    setTimeout(() => {
                        speakText("Izoh: " + question.explanation);
                    }, 1500);
                }
            }
        }

        function nextQuestion() {
            const section = currentExam.sections[currentSectionIndex];
            currentQuestionIndex++;
            
            // Check if current section is complete
            if (currentQuestionIndex >= section.questions.length) {
                // Move to next section or end exam
                currentSectionIndex++;
                currentQuestionIndex = 0;
                
                if (currentSectionIndex >= currentExam.sections.length) {
                    endExam();
                } else {
                    // Load next section
                    speakText(`${currentExam.sections[currentSectionIndex].name} bo'limiga o'tamiz.`);
                    loadQuestion();
                }
            } else {
                loadQuestion();
            }
        }

        function startExamTimer() {
            if (examTimer) clearInterval(examTimer);
            
            examTimer = setInterval(() => {
                timeRemaining--;
                
                const minutes = Math.floor(timeRemaining / 60);
                const seconds = timeRemaining % 60;
                document.getElementById('timer-display').textContent = 
                    `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                
                if (timeRemaining <= 0) {
                    endExam();
                }
            }, 1000);
        }

        function endExam() {
            clearInterval(examTimer);
            examMode = false;
            
            document.getElementById('exam-panel').classList.remove('active');
            document.getElementById('globalStatus').innerText = "Dars rejimi";
            
            // Calculate score
            let correctAnswers = 0;
            let totalQuestions = 0;
            
            userAnswers.forEach(answer => {
                if (answer.type !== 'writing') {
                    totalQuestions++;
                    if (answer.isCorrect) correctAnswers++;
                }
            });
            
            const percentage = totalQuestions > 0 ? Math.round((correctAnswers / totalQuestions) * 100) : 0;
            
            // Generate score report
            let scoreReport = `Imtihon tugadi!\n\n`;
            scoreReport += `Jami savollar: ${totalQuestions}\n`;
            scoreReport += `To'g'ri javoblar: ${correctAnswers}\n`;
            scoreReport += `Foiz: ${percentage}%\n\n`;
            
            if (percentage >= 90) {
                scoreReport += "Ajoyib! Siz mukammal natija ko'rsatdingiz.";
            } else if (percentage >= 70) {
                scoreReport += "Yaxshi! Davom eting.";
            } else if (percentage >= 50) {
                scoreReport += "O'rtacha. Ko'proq mashq qiling.";
            } else {
                scoreReport += "Qayta urinib ko'ring.";
            }
            
            // Display score in chat
            addMessage('teacher', scoreReport);
            
            // Reset teacher position
            teacherModel.position.set(0, 0, -5);
            teacherModel.rotation.y = 0;
            currentAnimation = 'idle';
            
            speakText(`Imtihon tugadi. Siz ${totalQuestions} savoldan ${correctAnswers} tasiga to'g'ri javob berdingiz. Bu ${percentage} foizni tashkil qiladi.`);
        }

        function startLessonMode() {
            examMode = false;
            document.getElementById('exam-panel').classList.remove('active');
            document.getElementById('globalStatus').innerText = "Dars rejimi";
            
            speakText("Dars rejimiga o'tdik. Qanday mavzuni o'rganmoqchisiz?");
        }

        // ========================================================================
        // ANIMATION LOOP
        // ========================================================================

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            // Update animation mixer
            if (mixer) {
                mixer.update(delta);
            }

            // Update lip-sync
            updateLipSync();

            // Update body movements
            updateBodyMovements();

            // Simple camera movement based on mouse
            camera.position.x += (mouseX * 0.5 - camera.position.x) * 0.05;
            camera.position.y += (mouseY * 0.5 + 1.7 - camera.position.y) * 0.05;
            camera.lookAt(0, 1.2, 0);

            // Render scene
            renderer.render(scene, camera);

            // Performance monitoring
            frameCount++;
            const currentTime = performance.now();
            if (currentTime - lastTime >= 1000) {
                fps = frameCount;
                frameCount = 0;
                lastTime = currentTime;
                updatePerformanceStats();
            }
        }

        function updatePerformanceStats() {
            document.getElementById('fps').textContent = fps;
            
            if (performance.memory) {
                const memoryMB = (performance.memory.usedJSHeapSize / 1048576).toFixed(1);
                document.getElementById('memory').textContent = memoryMB;
            }
        }

        // ========================================================================
        // UI INTERACTION HANDLERS
        // ========================================================================

        function setupUIHandlers() {
            // SAT Exam button
            document.getElementById('btn-sat-exam').addEventListener('click', () => {
                initAudioContext();
                startSATExam();
            });

            // IELTS Exam button
            document.getElementById('btn-ielts-exam').addEventListener('click', () => {
                initAudioContext();
                startIELTSExam();
            });

            // Lesson Mode button
            document.getElementById('btn-lesson').addEventListener('click', () => {
                initAudioContext();
                startLessonMode();
            });

            // Reset View button
            document.getElementById('btn-reset-view').addEventListener('click', () => {
                camera.position.set(0, 1.7, 4);
                mouseX = 0;
                mouseY = 0;
            });

            // Submit Answer button
            document.getElementById('btn-submit-answer').addEventListener('click', submitAnswer);

            // Next Question button
            document.getElementById('btn-next-question').addEventListener('click', nextQuestion);

            // Chat input
            document.getElementById('btn-send').addEventListener('click', sendMessage);
            document.getElementById('chat-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendMessage();
            });

            // Load voices for speech synthesis
            window.speechSynthesis.onvoiceschanged = () => {
                const voices = window.speechSynthesis.getVoices();
                console.log('Available voices:', voices.length);
            };
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            
            if (!message) return;

            addMessage(message, 'user');
            input.value = '';

            // Simple response logic
            let response = "";
            if (message.toLowerCase().includes('salom') || message.toLowerCase().includes('assalomu')) {
                response = "Assalomu alaykum! Qanday yordam bera olaman?";
            } else if (message.toLowerCase().includes('sat')) {
                response = "SAT imtihoni uchun tayyorlanishni boshlashimiz mumkin. SAT tugmasini bosing.";
            } else if (message.toLowerCase().includes('ielts')) {
                response = "IELTS imtihoni uchun tayyorlanishni boshlashimiz mumkin. IELTS tugmasini bosing.";
            } else if (message.toLowerCase().includes('dars')) {
                response = "Dars rejimiga o'tish uchun Lesson Mode tugmasini bosing.";
            } else {
                response = "Tushunarli. Sizga qanday yordam kerak?";
            }

            setTimeout(() => {
                addMessage(response, 'teacher');
                speakText(response);
            }, 500);
        }

        function addMessage(text, sender) {
            const chatMessages = document.getElementById('chat-messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            messageDiv.textContent = text;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // ========================================================================
        // INITIALIZATION
        // ========================================================================

        async function init() {
            console.log('Initializing Realistic Virtual Classroom...');
            
            try {
                // Check if Three.js is loaded
                if (typeof THREE === 'undefined') {
                    console.error('Three.js not loaded');
                    document.getElementById('loading-overlay').innerHTML = 
                        '<h2>Three.js kutubxonasi yuklanmadi</h2><p>three.min.js faylini frontend papkasiga joylang</p>';
                    return;
                }
                
                // Initialize Three.js
                initThreeJS();
                
                // Setup UI handlers
                setupUIHandlers();
                
                // Start animation loop
                animate();
                
                // Hide loading overlay
                setTimeout(() => {
                    document.getElementById('loading-overlay').classList.add('hidden');
                }, 2000);
                
                console.log('Realistic Virtual Classroom initialized successfully');
            } catch (error) {
                console.error('Initialization error:', error);
                document.getElementById('loading-overlay').innerHTML = 
                    '<h2>Xatolik yuz berdi</h2><p>' + error.message + '</p>';
            }
        }

        // Start initialization when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

        // Export for external use
        window.RealisticClassroom = {
            speak: speakText,
            startSAT: startSATExam,
            startIELTS: startIELTSExam,
            startLesson: startLessonMode
        };
    </script>
