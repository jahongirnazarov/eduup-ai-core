<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eduupai AI — High-Fidelity Beauty Modifier</title>
    <style>
        body { 
            margin: 0; background: #030712; 
            display: flex; flex-direction: column; 
            justify-content: center; align-items: center; 
            height: 100vh; font-family: sans-serif; color: white; 
        }
        #canvas-frame { box-shadow: 0 30px 80px rgba(0,0,0,0.9); border-radius: 16px; overflow: hidden; border: 3px solid #3b82f6; }
        canvas { display: block; }
        .controls { margin-top: 15px; display: flex; flex-direction: column; gap: 10px; background: #0f172a; padding: 15px; border-radius: 12px; border: 1px solid #1e293b; }
        .row { display: flex; gap: 10px; align-items: center; }
        .label { font-size: 14px; font-weight: bold; width: 100px; color: #94a3b8; }
        button { padding: 8px 16px; font-weight: bold; border: none; color: white; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .btn-style { background: #3b82f6; }
        button:hover { transform: translateY(-1px); opacity: 0.9; }
    </style>
</head>
<body>

<div style="font-size: 18px; margin-bottom: 12px; font-weight: bold; color: #3b82f6;">Eduupai AI — Natural Feature Customization (Chiroy Saqlovchi Tizim)</div>

<div id="canvas-frame">
    <canvas id="beautyCanvas" width="950" height="500"></canvas>
</div>

<div class="controls">
    <div class="row">
        <span class="label">Ko'z rangi:</span>
        <button class="btn-style" style="background: #78350f;" onclick="setEye('original')">Asl Jigarrang</button>
        <button class="btn-style" style="background: #2563eb;" onclick="setEye('crystal-blue')">Tiniq Ko'k</button>
        <button class="btn-style" style="background: #16a34a;" onclick="setEye('emerald-green')">Zumrad Yashil</button>
    </div>
    <div class="row">
        <span class="label">Soch rangi:</span>
        <button class="btn-style" style="background: #1c100b;" onclick="setHair('original')">Asl Tusi</button>
        <button class="btn-style" style="background: #ca8a04;" onclick="setHair('blonde')">Tillarang (Sariq)</button>
        <button class="btn-style" style="background: #0f172a;" onclick="setHair('brunette-dark')">To'q Qora</button>
    </div>
</div>

<script>
const canvas = document.getElementById('beautyCanvas');
const ctx = canvas.getContext('2d');

let eyeMode = 'original';
let hairMode = 'original';

function setEye(mode) { eyeMode = mode; }
function setHair(mode) { hairMode = mode; }

function renderLoop() {
    const time = Date.now();
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#090d16'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.fillStyle = '#021e17'; ctx.fillRect(440, 50, 480, 280);
    ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 4; ctx.strokeRect(440, 50, 480, 280);

    ctx.fillStyle = '#f3f4f6'; ctx.font = '18px monospace';
    ctx.fillText("Eduupai Personalized Assistant", 470, 100);
    ctx.fillStyle = '#3b82f6';
    ctx.fillText("Ko'z va Soch ranglari moslandi.", 470, 140);

    let breathe = Math.sin(time * 0.002) * 3;

    ctx.save();
    ctx.translate(200, 340);

    ctx.fillStyle = '#221510';
    ctx.beginPath();
    ctx.ellipse(0, -65 + breathe, 38, 48, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(-38, -65 + breathe, 76, 120);

    let jacketGrad = ctx.createLinearGradient(-50, 40, 50, 200);
    jacketGrad.addColorStop(0, '#312e81');
    jacketGrad.addColorStop(1, '#1e1b4b');
    ctx.fillStyle = jacketGrad;
    ctx.beginPath();
    ctx.moveTo(-32, 45 + breathe);
    ctx.bezierCurveTo(-55, 65, -62, 140, -55, 230);
    ctx.lineTo(55, 230);
    ctx.bezierCurveTo(62, 140, 55, 65, 32, 45 + breathe);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(-16, 45 + breathe);
    ctx.lineTo(0, 85 + breathe);
    ctx.lineTo(16, 45 + breathe);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#818cf8';
    ctx.beginPath();
    ctx.moveTo(-6, 58 + breathe);
    ctx.lineTo(6, 58 + breathe);
    ctx.lineTo(8, 110 + breathe);
    ctx.lineTo(0, 125 + breathe);
    ctx.lineTo(-8, 110 + breathe);
    ctx.closePath();
    ctx.fill();

    let skinGrad = ctx.createRadialGradient(0, -30 + breathe, 5, 0, -30 + breathe, 35);
    skinGrad.addColorStop(0, '#ffebd4');
    skinGrad.addColorStop(1, '#fcd34d');
    ctx.fillStyle = skinGrad;
    ctx.beginPath();
    ctx.arc(0, -30 + breathe, 32, 0, Math.PI * 2);
    ctx.fill();

    let hairColor = '#1c100b';
    if (hairMode === 'blonde') hairColor = '#ca8a04';
    if (hairMode === 'brunette-dark') hairColor = '#0f172a';
    
    ctx.fillStyle = hairColor;
    ctx.beginPath();
    ctx.arc(0, -42 + breathe, 34, Math.PI, 0);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-34, -42 + breathe);
    ctx.bezierCurveTo(-38, 0, -26, 15, -24, 30 + breathe);
    ctx.lineTo(-34, 30);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(34, -42 + breathe);
    ctx.bezierCurveTo(38, 0, 26, 15, 24, 30 + breathe);
    ctx.lineTo(34, 30);
    ctx.closePath();
    ctx.fill();

    if (time % 3500 < 150) {
        ctx.strokeStyle = '#27272a'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(-20, -35+breathe); ctx.lineTo(-6, -35+breathe); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(6, -35+breathe); ctx.lineTo(20, -35+breathe); ctx.stroke();
    } else {
        let eyeColor = '#4c2a15';
        if (eyeMode === 'crystal-blue') eyeColor = '#2563eb';
        if (eyeMode === 'emerald-green') eyeColor = '#16a34a';
        
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.ellipse(-13, -35 + breathe, 8, 5, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(13, -35 + breathe, 8, 5, 0, 0, Math.PI * 2); ctx.fill();
        
        ctx.fillStyle = eyeColor;
        ctx.beginPath(); ctx.arc(-10, -35 + breathe, 3.8, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(16, -35 + breathe, 3.8, 0, Math.PI * 2); ctx.fill();
        
        ctx.fillStyle = '#09090b';
        ctx.beginPath(); ctx.arc(-10, -35 + breathe, 1.8, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(16, -35 + breathe, 1.8, 0, Math.PI * 2); ctx.fill();
        
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.beginPath(); ctx.arc(-11.2, -36.2 + breathe, 1, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(14.8, -36.2 + breathe, 1, 0, Math.PI * 2); ctx.fill();
    }

    ctx.strokeStyle = '#27272a'; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.moveTo(-17, -42+breathe); ctx.lineTo(-9, -42+breathe); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(17, -42+breathe); ctx.lineTo(9, -42+breathe); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, -18+breathe, 6, 0, Math.PI); ctx.stroke();

    ctx.strokeStyle = '#ffebd4'; ctx.lineWidth = 7.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-36, 60 + breathe); ctx.lineTo(-50, 110 + breathe); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(36, 60 + breathe); ctx.lineTo(55, 30); ctx.lineTo(65, 0); ctx.stroke();

    ctx.restore();

    requestAnimationFrame(renderLoop);
}

renderLoop();
</script>
</body>
</html>
