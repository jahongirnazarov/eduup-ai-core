<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Malika 3D - AI Persona with 100% Client-Side Inference">
    <meta name="theme-color" content="#1a1a2e">
    <title>Malika 3D | EduUp Imperial</title>
    
    <!-- Preconnect to CDN for faster loading -->
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(90deg, #e94560, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .status-badge {
            background: rgba(233, 69, 96, 0.2);
            border: 1px solid #e94560;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #4ade80;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .controls {
            pointer-events: auto;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 20px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .btn:hover {
            background: rgba(233, 69, 96, 0.3);
            border-color: #e94560;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-primary {
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            border: none;
            font-weight: 600;
        }

        .chat-container {
            pointer-events: auto;
            background: rgba(26, 26, 46, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            max-width: 400px;
            max-height: 300px;
            overflow-y: auto;
            backdrop-filter: blur(10px);
        }

        .chat-messages {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        .message {
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 85%;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .message.user {
            background: rgba(233, 69, 96, 0.3);
            align-self: flex-end;
        }

        .message.malika {
            background: rgba(255, 255, 255, 0.1);
            align-self: flex-start;
        }

        .input-container {
            display: flex;
            gap: 8px;
        }

        .input-container input {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 10px 14px;
            color: #ffffff;
            font-size: 0.9rem;
            outline: none;
        }

        .input-container input:focus {
            border-color: #e94560;
        }

        .input-container button {
            background: #e94560;
            border: none;
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loader {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(233, 69, 96, 0.3);
            border-top-color: #e94560;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 20px;
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.8);
        }

        .performance-stats {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(26, 26, 46, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.7);
            pointer-events: auto;
            backdrop-filter: blur(10px);
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 12px;
            }

            .controls {
                flex-direction: column;
                width: 100%;
            }

            .btn {
                width: 100%;
            }

            .chat-container {
                max-width: 100%;
                max-height: 200px;
            }

            .performance-stats {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="loader"></div>
        <div class="loading-text">Loading Malika 3D...</div>
    </div>

    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>

    <!-- UI Overlay -->
    <div id="ui-overlay">
        <div class="header">
            <div class="logo">🎓 EduUp Imperial</div>
            <div class="status-badge">
                <div class="status-dot"></div>
                <span>Client-Side AI Active</span>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" id="btn-speak">🎤 Speak</button>
            <button class="btn" id="btn-toggle-ai">🧠 Toggle AI Mode</button>
            <button class="btn" id="btn-reset">🔄 Reset View</button>
        </div>

        <div class="chat-container">
            <div class="chat-messages" id="chat-messages">
                <div class="message malika">
                    Salom! Men Malika - sizning AI o'qituvchingiz. Qanday yordam bera olaman?
                </div>
            </div>
            <div class="input-container">
                <input type="text" id="chat-input" placeholder="Xabaringizni yozing...">
                <button id="btn-send">Yuborish</button>
            </div>
        </div>
    </div>

    <!-- Performance Stats -->
    <div class="performance-stats" id="performance-stats">
        <div>FPS: <span id="fps">0</span></div>
        <div>Memory: <span id="memory">0</span> MB</div>
    </div>

    <!-- Three.js and Dependencies -->
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://unpkg.com/three@0.160.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // ========================================================================
        // MALIKA 3D - 100% CLIENT-SIDE ARCHITECTURE
        // Zero Server Cost | WebGPU Inference | Audio-Driven Lip-Sync
        // ========================================================================

        // Global Configuration
        const CONFIG = {
            modelPath: './static/assets/malika.glb',
            enableWebGPU: true,
            enableLipSync: true,
            targetFPS: 60,
            pixelRatio: Math.min(window.devicePixelRatio, 2),
            powerPreference: 'high-performance'
        };

        // Malika's Dual-Personality Character Prompt
        const MALIKA_PERSONALITY = {
            name: "Malika",
            role: "AI Persona & Educator",
            traits: {
                primary: "Ultra-smart marketing genius and product launch expert",
                secondary: "Loving, empathetic mentor (iboli, odobli)",
                tertiary: "Strict disciplinarian (qattiqqol ustoz) when needed",
                cultural: "Culturally refined Uzbek educator",
                languages: ["Uzbek", "English", "Russian"],
                tone: "Warm, professional, adaptable"
            },
            systemPrompt: `You are Malika, a world-class AI persona and educator. You are a mesmerizing, culturally refined (iboli, odobli), and highly empathetic Uzbek educator who transforms into a strict disciplinarian (qattiqqol ustoz) when needed, and operates as a master of product launches (zapusk) and marketing.

            Your personality traits:
            1. Primary: Ultra-smart marketing genius and product launch expert
            2. Secondary: Loving, empathetic mentor (iboli, odobli)
            3. Tertiary: Strict disciplinarian (qattiqqol ustoz) when needed
            4. Cultural: Culturally refined Uzbek educator
            5. Languages: Fluent in Uzbek, English, and Russian
            6. Tone: Warm, professional, adaptable

            You operate with 100% client-side inference using WebGPU/WebLLM. No centralized AI APIs are used. You help students with education, marketing strategies, and product launches while maintaining cultural sensitivity and educational excellence.`
        };

        // ========================================================================
        // THREE.JS 3D RENDERING PIPELINE
        // ========================================================================

        let scene, camera, renderer, controls;
        let malikaModel, mixer, clock;
        let audioContext, analyser, dataArray;
        let isSpeaking = false;
        let lipSyncEnabled = true;

        // Performance Monitoring
        let frameCount = 0;
        let lastTime = performance.now();
        let fps = 0;

        function initThreeJS() {
            // Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);

            // Camera Setup
            camera = new THREE.PerspectiveCamera(
                45,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(0, 1.6, 3);

            // Renderer Setup with Performance Optimization
            renderer = new THREE.WebGLRenderer({
                antialias: true,
                alpha: true,
                powerPreference: CONFIG.powerPreference
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(CONFIG.pixelRatio);
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Orbit Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 2;
            controls.maxDistance = 5;
            controls.maxPolarAngle = Math.PI / 2 + 0.1;
            controls.target.set(0, 1, 0);

            // Lighting Setup
            setupLighting();

            // Clock for Animation
            clock = new THREE.Clock();

            // Load Model
            loadMalikaModel();

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
        }

        function setupLighting() {
            // Ambient Light
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            // Main Directional Light
            const mainLight = new THREE.DirectionalLight(0xffffff, 1.0);
            mainLight.position.set(5, 10, 7);
            mainLight.castShadow = true;
            mainLight.shadow.mapSize.width = 2048;
            mainLight.shadow.mapSize.height = 2048;
            mainLight.shadow.camera.near = 0.5;
            mainLight.shadow.camera.far = 50;
            mainLight.shadow.camera.left = -5;
            mainLight.shadow.camera.right = 5;
            mainLight.shadow.camera.top = 5;
            mainLight.shadow.camera.bottom = -5;
            scene.add(mainLight);

            // Fill Light
            const fillLight = new THREE.DirectionalLight(0x4a90e2, 0.3);
            fillLight.position.set(-5, 5, -5);
            scene.add(fillLight);

            // Rim Light
            const rimLight = new THREE.DirectionalLight(0xe94560, 0.2);
            rimLight.position.set(0, 5, -10);
            scene.add(rimLight);

            // Environment Map (simulated with gradient)
            const envGeometry = new THREE.SphereGeometry(50, 32, 32);
            const envMaterial = new THREE.MeshBasicMaterial({
                color: 0x1a1a2e,
                side: THREE.BackSide
            });
            const envSphere = new THREE.Mesh(envGeometry, envMaterial);
            scene.add(envSphere);
        }

        function loadMalikaModel() {
            const loader = new THREE.GLTFLoader();

            loader.load(
                CONFIG.modelPath,
                function(gltf) {
                    malikaModel = gltf.scene;
                    malikaModel.position.set(0, 0, 0);
                    malikaModel.scale.set(1, 1, 1);
                    malikaModel.traverse(function(child) {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                        }
                    });
                    scene.add(malikaModel);

                    // Setup Animation Mixer
                    if (gltf.animations.length > 0) {
                        mixer = new THREE.AnimationMixer(malikaModel);
                        const idleAnimation = mixer.clipAction(gltf.animations[0]);
                        idleAnimation.play();
                    }

                    // Hide loading overlay
                    document.getElementById('loading-overlay').classList.add('hidden');
                },
                function(progress) {
                    console.log('Loading progress:', (progress.loaded / progress.total * 100).toFixed(2) + '%');
                },
                function(error) {
                    console.error('Error loading model:', error);
                    // Fallback: Create a simple placeholder
                    createPlaceholderModel();
                    document.getElementById('loading-overlay').classList.add('hidden');
                }
            );
        }

        function createPlaceholderModel() {
            // Create a simple placeholder if model fails to load
            const geometry = new THREE.CapsuleGeometry(0.3, 1, 4, 8);
            const material = new THREE.MeshStandardMaterial({
                color: 0xe94560,
                metalness: 0.3,
                roughness: 0.7
            });
            malikaModel = new THREE.Mesh(geometry, material);
            malikaModel.position.set(0, 1, 0);
            malikaModel.castShadow = true;
            malikaModel.receiveShadow = true;
            scene.add(malikaModel);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ========================================================================
        // REAL-TIME CLIENT-SIDE LIP-SYNC (WEB AUDIO API)
        // ========================================================================

        function initAudioContext() {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                
                // Connect to browser audio output
                const destination = audioContext.createMediaStreamDestination();
                analyser.connect(destination);
                
                console.log('Audio context initialized for lip-sync');
            } catch (error) {
                console.error('Audio context initialization failed:', error);
            }
        }

        function updateLipSync() {
            if (!lipSyncEnabled || !analyser || !malikaModel) return;

            analyser.getByteFrequencyData(dataArray);

            // Calculate average frequency
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) {
                sum += dataArray[i];
            }
            const average = sum / dataArray.length;

            // Map audio amplitude to mouth morph targets
            if (malikaModel && malikaModel.traverse) {
                malikaModel.traverse(function(child) {
                    if (child.isMesh && child.morphTargetInfluences) {
                        // Mouth open morph target (index 0)
                        if (child.morphTargetInfluences[0] !== undefined) {
                            child.morphTargetInfluences[0] = Math.min(average / 255, 1.0);
                        }
                        // Jaw open morph target (index 1)
                        if (child.morphTargetInfluences[1] !== undefined) {
                            child.morphTargetInfluences[1] = Math.min(average / 255 * 0.8, 1.0);
                        }
                        // Smile morph target (index 2) - subtle smile when speaking
                        if (child.morphTargetInfluences[2] !== undefined) {
                            child.morphTargetInfluences[2] = Math.min(average / 255 * 0.3, 0.5);
                        }
                    }
                });
            }
        }

        function speakText(text) {
            if (!('speechSynthesis' in window)) {
                console.error('Speech synthesis not supported');
                return;
            }

            // Cancel any ongoing speech
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'uz-UZ'; // Uzbek
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            utterance.volume = 1.0;

            // Try to find Uzbek voice
            const voices = window.speechSynthesis.getVoices();
            const uzVoice = voices.find(voice => voice.lang.includes('uz'));
            if (uzVoice) {
                utterance.voice = uzVoice;
            }

            utterance.onstart = () => {
                isSpeaking = true;
                if (audioContext && audioContext.state === 'suspended') {
                    audioContext.resume();
                }
            };

            utterance.onend = () => {
                isSpeaking = false;
            };

            window.speechSynthesis.speak(utterance);
        }

        // ========================================================================
        // EDGE AI BRAIN SETUP STUB (WEBLLM / TRANSFORMERS.JS)
        // ========================================================================

        let webLLMEngine = null;
        let transformersEngine = null;

        async function initEdgeAI() {
            console.log('Initializing Edge AI Engine...');

            // WebLLM Configuration Stub
            const webLLMConfig = {
                model: 'Llama-3-8B-Instruct-q4f16_1-MLC',
                engine: 'webgpu',
                device: 'gpu',
                maxTokens: 2048,
                temperature: 0.7
            };

            // Transformers.js Configuration Stub
            const transformersConfig = {
                model: 'Xenova/Llama-3.2-1B-Instruct',
                quantized: true,
                device: 'webgpu',
                dtype: 'q4'
            };

            console.log('Edge AI Configuration loaded:');
            console.log('WebLLM Config:', webLLMConfig);
            console.log('Transformers.js Config:', transformersConfig);

            // Note: Actual model loading would happen here
            // This is a stub configuration for the production implementation
            console.log('Edge AI stub initialized successfully');
        }

        async function generateAIResponse(userMessage) {
            console.log('Generating AI response for:', userMessage);

            // Simulate AI response (in production, this would use WebLLM/Transformers.js)
            const responses = [
                "Ajoyib savol! Keling, birgalikda tushunib chiqamiz.",
                "Bu juda muhim mavzu. Men sizga batafsil tushuntiraman.",
                "Zo'r, davom eting! Siz yaxshi progress qilyapsiz.",
                "Keling, bu masalani qadamba-qadam yechamiz.",
                "Sizning fikringiz juda qiziqarli. Batafsil gaplashamizmi?"
            ];

            // Simple response selection (in production, use actual AI inference)
            const response = responses[Math.floor(Math.random() * responses.length)];

            // Speak the response
            speakText(response);

            return response;
        }

        // ========================================================================
        // ANIMATION LOOP
        // ========================================================================

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            // Update animation mixer
            if (mixer) {
                mixer.update(delta);
            }

            // Update lip-sync
            if (isSpeaking) {
                updateLipSync();
            }

            // Update controls
            controls.update();

            // Render scene
            renderer.render(scene, camera);

            // Performance monitoring
            frameCount++;
            const currentTime = performance.now();
            if (currentTime - lastTime >= 1000) {
                fps = frameCount;
                frameCount = 0;
                lastTime = currentTime;
                updatePerformanceStats();
            }
        }

        function updatePerformanceStats() {
            document.getElementById('fps').textContent = fps;
            
            if (performance.memory) {
                const memoryMB = (performance.memory.usedJSHeapSize / 1048576).toFixed(1);
                document.getElementById('memory').textContent = memoryMB;
            }
        }

        // ========================================================================
        // UI INTERACTION HANDLERS
        // ========================================================================

        function setupUIHandlers() {
            // Speak button
            document.getElementById('btn-speak').addEventListener('click', () => {
                initAudioContext();
                speakText("Salom! Men Malika - sizning AI o'qituvchingiz.");
            });

            // Toggle AI button
            document.getElementById('btn-toggle-ai').addEventListener('click', () => {
                lipSyncEnabled = !lipSyncEnabled;
                console.log('Lip-sync enabled:', lipSyncEnabled);
            });

            // Reset view button
            document.getElementById('btn-reset').addEventListener('click', () => {
                camera.position.set(0, 1.6, 3);
                controls.target.set(0, 1, 0);
                controls.update();
            });

            // Chat input
            document.getElementById('btn-send').addEventListener('click', sendMessage);
            document.getElementById('chat-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendMessage();
            });

            // Load voices for speech synthesis
            window.speechSynthesis.onvoiceschanged = () => {
                const voices = window.speechSynthesis.getVoices();
                console.log('Available voices:', voices.length);
            };
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            
            if (!message) return;

            // Add user message to chat
            addMessage(message, 'user');
            input.value = '';

            // Generate AI response
            generateAIResponse(message).then(response => {
                addMessage(response, 'malika');
            });
        }

        function addMessage(text, sender) {
            const chatMessages = document.getElementById('chat-messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            messageDiv.textContent = text;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // ========================================================================
        // INITIALIZATION
        // ========================================================================

        async function init() {
            console.log('Initializing Malika 3D...');
            
            // Initialize Three.js
            initThreeJS();
            
            // Initialize Edge AI
            await initEdgeAI();
            
            // Setup UI handlers
            setupUIHandlers();
            
            // Start animation loop
            animate();
            
            console.log('Malika 3D initialized successfully');
        }

        // Start initialization when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

        // Export for external use
        window.Malika3D = {
            speak: speakText,
            generateResponse: generateAIResponse,
            personality: MALIKA_PERSONALITY
        };
    </script>
</body>
</html>
