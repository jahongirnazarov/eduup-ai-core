<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="EDUUPAI - Harvard standartidagi ta'lim platformasi">
    <meta name="theme-color" content="#1a1a2e">
    <title>EDUUPAI - Harvard Standart Ta'lim</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/assets/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0a0a0f;
            color: #ffffff;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        
        #canvas-container {
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }
        
        #ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            border-radius: 15px;
            pointer-events: auto;
        }
        
        .logo {
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .controls {
            display: flex;
            gap: 10px;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            pointer-events: auto;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .lesson-panel {
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 15px;
            max-width: 400px;
            pointer-events: auto;
            margin-top: auto;
        }
        
        .lesson-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #667eea;
        }
        
        .lesson-content {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 15px;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0f;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }
        
        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(102, 126, 234, 0.2);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-text {
            margin-top: 20px;
            font-size: 18px;
            color: #667eea;
        }
        
        .performance-indicator {
            position: fixed;
            top: 80px;
            right: 20px;
            background: rgba(26, 26, 46, 0.9);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 12px;
            z-index: 100;
            pointer-events: auto;
        }
        
        .lod-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 10px;
            margin-left: 10px;
        }
        
        .lod-high {
            background: #4caf50;
            color: white;
        }
        
        .lod-medium {
            background: #ff9800;
            color: white;
        }
        
        .lod-low {
            background: #f44336;
            color: white;
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 10px;
                padding: 10px 15px;
            }
            
            .logo {
                font-size: 18px;
            }
            
            .controls {
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .btn {
                padding: 8px 15px;
                font-size: 12px;
            }
            
            .lesson-panel {
                max-width: 100%;
                padding: 15px;
            }
            
            .lesson-title {
                font-size: 16px;
            }
            
            .lesson-content {
                font-size: 14px;
                max-height: 150px;
            }
        }
        
        @media (max-width: 480px) {
            #ui-overlay {
                padding: 10px;
            }
            
            .header {
                padding: 8px 12px;
            }
            
            .logo {
                font-size: 16px;
            }
            
            .btn {
                padding: 6px 12px;
                font-size: 11px;
            }
            
            .lesson-panel {
                padding: 12px;
            }
        }
        
        /* Smart Board & TV Optimization */
        @media (min-width: 1920px) {
            .header {
                padding: 20px 40px;
            }
            
            .logo {
                font-size: 32px;
            }
            
            .btn {
                padding: 15px 30px;
                font-size: 18px;
            }
            
            .lesson-panel {
                max-width: 600px;
                padding: 35px;
            }
            
            .lesson-title {
                font-size: 28px;
            }
            
            .lesson-content {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="loading-spinner"></div>
        <div class="loading-text">Yuklanmoqda...</div>
    </div>
    
    <div id="canvas-container"></div>
    
    <div id="ui-overlay">
        <div class="header">
            <div class="logo">EDUUPAI - Harvard</div>
            <div class="controls">
                <button class="btn btn-primary" id="start-lesson">Darsni Boshlash</button>
                <button class="btn btn-secondary" id="toggle-sound">Ovoz</button>
                <button class="btn btn-secondary" id="toggle-quality">Sifat</button>
            </div>
        </div>
        
        <div class="performance-indicator">
            <span>FPS: <span id="fps-counter">60</span></span>
            <span class="lod-badge lod-high" id="lod-badge">HIGH</span>
        </div>
        
        <div class="lesson-panel">
            <div class="lesson-title" id="lesson-title">Matematika - Algebra</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="lesson-content" id="lesson-content">
                Darsni boshlash uchun "Darsni Boshlash" tugmasini bosing.
            </div>
        </div>
    </div>
    
    <script src="main.js"></script>
</body>
</html>
